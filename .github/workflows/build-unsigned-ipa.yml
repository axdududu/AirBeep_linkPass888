name: Build Unsigned IPA

on:
  workflow_dispatch: # 支持手动触发
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build and archive
        run: |
          xcodebuild clean archive \
            -project airBeep.xcodeproj \
            -scheme airBeep \
            -configuration Release \
            -archivePath build/AirBeep.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/AirBeep.xcarchive/Products/Applications/AirBeep.app Payload/
          zip -r AirBeep-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirBeep-unsigned-ipa
          path: AirBeep-unsigned.ipa
